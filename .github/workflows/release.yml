name: Release

# Builds installers for macOS and Windows and attaches them to a draft
# GitHub Release. Trigger it manually from the Actions tab, or by pushing
# a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`).
#
# macOS builds are ad-hoc signed (bundle.macOS.signingIdentity in
# tauri.conf.json), not notarized, so no Apple secrets are needed here.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary runs natively on both Apple Silicon and Intel
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Produces both .msi (WiX) and .exe (NSIS) installers
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No API key is baked into the build. Users paste their own Gemini
          # key into Settings inside the app (stored in local SQLite).
        with:
          tagName: v__VERSION__
          releaseName: 'ADHD Sprint Planner v__VERSION__'
          releaseBody: |
            Free and open source. Download the file for your computer from **Assets** below.

            **Mac** (Apple Silicon and Intel): download the `.dmg`.
            1. Open the `.dmg` and drag the app to Applications.
            2. Double-click the app. macOS will warn that it can't verify the app and won't open it, because the app isn't notarized by Apple. Click **Done**.
            3. Open **System Settings → Privacy & Security**, scroll down, click **Open Anyway**, and confirm.

            You repeat steps 2 and 3 for each new version you install.

            **Windows** (10 or 11, 64-bit): download the `-setup.exe` and run it. If a blue SmartScreen box appears, click **More info**, then **Run anyway**.

            **Then add your free Gemini key:** the AI features use your own key, which stays on your computer. Create one at https://aistudio.google.com/apikey and paste it into **Settings → Gemini API key** in the app.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
